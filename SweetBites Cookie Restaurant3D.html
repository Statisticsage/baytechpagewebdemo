<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>3D Scroll Experience for Restaurants and Bakeries | Baytechpage</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet"><style>
:root{--bg:#FFF3E2;--g1:#FFE2B8;--fg:#2B1A10;--mut:#7B5E49;--acc:#F29A2E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120C08;--g1:#3A2212;--fg:#FBEAD3;--mut:#CDAE92}}
:root[data-theme="dark"]{--bg:#120C08;--g1:#3A2212;--fg:#FBEAD3;--mut:#CDAE92}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px}.top img{height:30px;border-radius:6px;background:#fff}.top b{letter-spacing:.14em;font-size:13px}
.tg{margin-left:auto;display:flex;background:rgba(10,31,60,.85);border-radius:99px;padding:3px}.tg button{border:0;background:none;color:#CFE0F2;padding:7px 14px;border-radius:99px;font:700 13px inherit;cursor:pointer}.tg button.on{background:var(--acc);color:#2b1a00}
.track{height:820vh;position:relative}.stage{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;background:radial-gradient(circle at 50% 45%,var(--g1),var(--bg) 70%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:0;right:0;text-align:center;padding:0 20px;opacity:0;pointer-events:none}.cap h2{font-size:clamp(30px,6vw,64px);margin:0;line-height:1.05;letter-spacing:-.01em}.cap p{color:var(--mut);margin:8px 0 0;font-size:clamp(14px,2vw,18px)}.cap small{letter-spacing:.3em;color:var(--acc);font-weight:800;font-size:12px}
.c0{top:13%}.c1{top:12%}.c2{bottom:9%}.c3{top:12%}.c4{bottom:10%;pointer-events:auto}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;color:var(--mut);animation:b 1.6s infinite}@keyframes b{50%{transform:translate(-50%,6px)}}
.end{position:absolute;inset:0;background:#07101E;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;opacity:0;pointer-events:none}.end img{width:min(260px,60vw);border-radius:14px;background:#fff;padding:6px}.end small{letter-spacing:.4em;color:#7DD3FC;margin-top:22px;font-size:12px}.end h2{font-size:clamp(26px,5vw,48px);margin:8px 0 6px}.end p{color:#9FB8D6;max-width:460px;margin:0 0 20px}
.btn{display:inline-block;background:var(--acc);color:#2b1a00;padding:13px 26px;border-radius:99px;font-weight:800;text-decoration:none}.end .btn{pointer-events:auto}
.bar{position:absolute;left:0;right:0;background:#000;height:0;z-index:5}.bar.t{top:0}.bar.b{bottom:0}
.grain{position:absolute;inset:-50%;opacity:.07;pointer-events:none;z-index:6;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.6'/></svg>");animation:g .5s steps(4) infinite}@keyframes g{25%{transform:translate(-30px,20px)}50%{transform:translate(20px,-30px)}75%{transform:translate(-10px,-20px)}}
.fb{display:none;padding:120px 24px;text-align:center}
@media (prefers-reduced-motion:reduce){.grain,.hint{animation:none}}
